name: fitness-medical

services:
  mysql:
    image: mysql:8.4
    container_name: fitness-medical-mysql
    restart: unless-stopped
    ports:
      # 호스트 포트는 환경마다 다를 수 있습니다.
      # RTX 4090 노트북(Windows): 3308 → 컨테이너 3306
      #   (이 머신에선 로컬 mysqld가 3307을 사용 중)
      # Mac 등 다른 환경: 보통 3307 또는 해당 PC에서 비어 있는 포트로 변경
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_2026
      MYSQL_DATABASE: fitness_medical
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_dev_2026
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 컨테이너를 다시 만들어도 DB 데이터가 유지되는 named volume입니다.
      - fitness_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_2026"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fitness_mysql_data:
