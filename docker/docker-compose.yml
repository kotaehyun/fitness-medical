name: fitness-medical

services:
  mysql:
    image: mysql:8.4
    container_name: fitness-medical-mysql
    restart: unless-stopped
    ports:
      # Mac의 3307 포트를 컨테이너 MySQL 기본 포트 3306에 연결합니다.
      # 기존 MariaDB 3306과 충돌하지 않습니다.
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_2026
      MYSQL_DATABASE: fitness_medical
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_dev_2026
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 컨테이너를 다시 만들어도 DB 데이터가 유지되는 named volume입니다.
      - fitness_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_2026"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fitness_mysql_data:
