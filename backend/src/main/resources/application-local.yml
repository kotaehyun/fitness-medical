# local 프로필은 별도 DB 설치 없이 Java와 API를 연습할 때 사용합니다.
# application.yml의 spring.profiles.default 값 때문에 별도 옵션 없이 실행하면 적용됩니다.

spring:
  datasource:
    # H2를 파일 모드로 실행합니다. backend/data/ 에 남으므로 재시작해도 가입 데이터가 유지됩니다.
    # MODE=MySQL은 H2의 SQL 문법을 가능한 범위에서 MySQL과 비슷하게 맞춥니다.
    # DB_CLOSE_DELAY=-1은 애플리케이션 실행 중 DB가 먼저 닫히는 것을 방지합니다.
    url: jdbc:h2:file:./data/fitnessmedical;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 엔티티 기준으로 테이블을 맞추고 데이터는 남깁니다. create-drop은 종료 시 전부 삭제합니다.
      # 개발 단계에서만 사용합니다. 운영은 validate + Flyway를 권장합니다.
      ddl-auto: update
    properties:
      hibernate:
        # 콘솔에서 Hibernate가 생성한 SQL을 읽기 쉽게 줄바꿈합니다.
        format_sql: true

  h2:
    console:
      # 브라우저에서 http://localhost:8081/h2-console 로 DB를 확인할 수 있습니다. (SERVER_PORT=8081)
      enabled: true
      path: /h2-console

logging:
  level:
    # local 학습 환경에서 JPA가 실행하는 SQL을 확인합니다.
    org.hibernate.SQL: DEBUG
