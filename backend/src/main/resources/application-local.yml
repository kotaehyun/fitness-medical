# local 프로필은 별도 DB 설치 없이 Java와 API를 연습할 때 사용합니다.
# application.yml의 spring.profiles.default 값 때문에 별도 옵션 없이 실행하면 적용됩니다.

spring:
  datasource:
    # H2를 메모리 모드로 실행합니다. 애플리케이션을 종료하면 데이터가 사라집니다.
    # MODE=MySQL은 H2의 SQL 문법을 가능한 범위에서 MySQL과 비슷하게 맞춥니다.
    # DB_CLOSE_DELAY=-1은 애플리케이션 실행 중 DB가 먼저 닫히는 것을 방지합니다.
    url: jdbc:h2:mem:fitnessmedical;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 시작할 때 엔티티 기준으로 테이블을 만들고 종료할 때 삭제합니다.
      # 빠른 학습에는 편하지만 실제 운영 DB에는 사용하면 안 됩니다.
      ddl-auto: create-drop
    properties:
      hibernate:
        # 콘솔에서 Hibernate가 생성한 SQL을 읽기 쉽게 줄바꿈합니다.
        format_sql: true

  h2:
    console:
      # 브라우저에서 http://localhost:8080/h2-console 로 DB를 확인할 수 있습니다.
      enabled: true
      path: /h2-console

logging:
  level:
    # local 학습 환경에서 JPA가 실행하는 SQL을 확인합니다.
    org.hibernate.SQL: DEBUG
