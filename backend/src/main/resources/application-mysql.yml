# mysql 프로필은 Docker로 실행한 Fitness Medical 전용 MySQL 8.4를 사용합니다.
# 실행 예시: SPRING_PROFILES_ACTIVE=mysql ./gradlew bootRun

spring:
  datasource:
    # ${환경변수:기본값} 문법은 환경변수가 없을 때 콜론 뒤의 값을 사용합니다.
    # MySQL 컨테이너 내부 포트는 3306이지만, Mac에서는 3307로 연결합니다.
    # 기존 MariaDB가 Mac의 3306을 사용하므로 두 DB는 충돌하지 않습니다.
    url: ${DB_URL:jdbc:mysql://localhost:3307/fitness_medical?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:fitness_user}

    # 아래 기본 비밀번호는 로컬 학습용입니다.
    # 배포 환경에서는 파일을 수정하지 말고 DB_PASSWORD 환경변수를 설정해야 합니다.
    password: ${DB_PASSWORD:fitness_dev_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      # HikariCP는 Spring Boot의 기본 DB 커넥션 풀입니다.
      # 학습용 프로젝트이므로 연결 수를 작게 유지합니다.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      # 엔티티 변경을 테이블에 반영합니다. 개발 단계에서만 사용합니다.
      # 운영 단계에서는 validate와 Flyway 같은 마이그레이션 도구를 권장합니다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # MySQL 프로필에서도 실행 SQL은 확인하되 바인딩된 개인정보 값은 출력하지 않습니다.
    org.hibernate.SQL: DEBUG
