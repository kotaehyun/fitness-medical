spring:
  # 모든 실행 환경(local, mysql 등)에서 공통으로 사용하는 애플리케이션 이름입니다.
  application:
    name: fitness-medical-backend

  # 실행 프로필을 따로 지정하지 않으면 application-local.yml을 읽습니다.
  # MySQL을 사용할 때는 SPRING_PROFILES_ACTIVE=mysql로 실행합니다.
  profiles:
    default: local

  jackson:
    # JSON 날짜와 시간을 서버 기본 시간대가 아닌 한국 시간 기준으로 처리합니다.
    time-zone: Asia/Seoul
    # 값이 없는 필드도 JSON 응답에 포함하여 프론트엔드 응답 형태를 일정하게 유지합니다.
    default-property-inclusion: always

  jpa:
    # Controller 응답 생성 시점까지 DB 연결을 붙잡지 않도록 비활성화합니다.
    # 필요한 데이터는 Service 계층의 트랜잭션 안에서 조회해야 합니다.
    open-in-view: false

server:
  # 백엔드 REST API가 요청을 기다리는 포트입니다.
  # SERVER_PORT 환경변수가 있으면 그 값을 우선 사용합니다.
  port: ${SERVER_PORT:8080}

  servlet:
    # API 주소 앞에 별도의 공통 경로를 붙이지 않습니다.
    context-path: /

  error:
    # 응답에 예외 메시지를 항상 노출하지 않아 불필요한 내부 정보 노출을 막습니다.
    include-message: never

logging:
  level:
    # 애플리케이션 코드는 개발 중 흐름을 확인할 수 있도록 DEBUG로 출력합니다.
    com.fitnessmedical: DEBUG
    # Spring Framework 자체 로그는 너무 많지 않도록 INFO로 유지합니다.
    org.springframework: INFO
